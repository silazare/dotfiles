# mkdir -p ~/.config/sofka
[views."v1/pods"]
columns = [
  #{ name = "CPU/R",  metric = "cpu-request", wide = true },
  { name = "%CPU/R", metric = "cpu-request-utilization", wide = true },
  { name = "%CPU/L", metric = "cpu-limit-utilization", wide = true },

  #{ name = "MEM/R",  metric = "memory-request", wide = true },
  { name = "%MEM/R", metric = "memory-request-utilization", wide = true },
  { name = "%MEM/L", metric = "memory-limit-utilization", wide = true },
]

[views."v1/persistentvolumes"]
columns = [
  { name = "CLAIM-NS", path = "/spec/claimRef/namespace" },
  { name = "ACCESS", path = "/spec/accessModes/0", wide = true },
  { name = "RECLAIM", path = "/spec/persistentVolumeReclaimPolicy", wide = true },
  { name = "STORAGECLASS", path = "/spec/storageClassName", wide = true },
]

[views."v1/persistentvolumeclaims"]
columns = [
  { name = "ACCESS", path = "/spec/accessModes/0", wide = true },
  { name = "STORAGECLASS", path = "/spec/storageClassName", wide = true },
]
